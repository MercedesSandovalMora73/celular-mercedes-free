<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IO Móvil</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0c29">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
body{margin:0;font-family:'Outfit';min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:#fffef5;border:2px solid #FFD700;border-radius:28px;padding:22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.avatar{width:110px;height:110px;margin:0 auto 10px;background:radial-gradient(circle at 30% 30%,#FFF9C4,#FFD700 40%,#B8860B);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:48px;color:#2a145a}
h1{margin:6px 0 0;color:#1e0f3f} p{color:#6b5a8a;font-size:13px}
input{width:100%;margin-top:14px;padding:14px 16px;border-radius:999px;border:2px solid #f1d85a;font-size:15px;box-sizing:border-box}
button{width:100%;margin-top:10px;padding:14px;border-radius:999px;border:0;background:linear-gradient(135deg,#5b3cc6,#302b63);color:#fff;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div class="card">
<div class="avatar">IO</div>
<h1>IO Móvil</h1>
<p>Navegación Cuántica Dorada</p>
<input type="text" id="url" placeholder="Ej: google.com">
<button onclick="let u=document.getElementById('url').value.trim();if(!u)return;if(!u.startsWith('http'))u='https://'+u;location.href=u">➡ Navegar</button>
<p style="font-size:10px;margin-top:14px;color:#a0906a">IO INTELIGENCIA ÓMICA © 2026</p>
</div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
